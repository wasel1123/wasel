<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e4f4c"><title>واصل</title>
<!-- ===== app.html: لما النت يفصل ويرجع، التطبيق بيعمل «تحديث» فبيفتح الصفحة دي بدل صفحة GitHub 404.
     بترجّع العميل/المندوب لنفس صفحته في نفس مدينته، ولو مفيش نت بتستنى لحد ما يرجع لوحدها ===== -->
<style>html,body{margin:0;height:100%;background:#0e4f4c;overflow:hidden;font-family:system-ui,"Segoe UI",Tahoma,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0e4f4c;display:none}
#ld{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0 28px;background:#0e4f4c;color:#fff;text-align:center;transition:opacity .35s}
#ld.out{opacity:0;pointer-events:none}
#lg{width:92px;height:92px;border-radius:26px;background:#fff;color:#0e4f4c;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#ic{font-size:44px;line-height:1}
#t1{font-size:22px;font-weight:800}
#t2{font-size:15px;color:#d5ebe8;line-height:1.7;max-width:300px}
#sp{width:30px;height:30px;border:4px solid rgba(255,255,255,.3);border-top-color:#f2b544;border-radius:50%;animation:sp .8s linear infinite}
#rt{border:0;border-radius:14px;padding:13px 30px;background:#f2b544;color:#1b1200;font-size:16px;font-weight:800;font-family:inherit}
#sw{position:fixed;left:10px;bottom:10px;z-index:8;height:38px;border:0;border-radius:99px;background:rgba(14,79,76,.92);color:#fff;font-size:13px;font-weight:700;padding:0 14px;box-shadow:0 2px 10px rgba(0,0,0,.3);display:none;font-family:inherit}
@keyframes sp{to{transform:rotate(360deg)}}</style></head><body>
<div id="ld"><div id="lg">و</div><div id="ic">📶</div><div id="t1">جاري الاتصال...</div><div id="t2">ثواني ونرجعك لواصل</div><i id="sp"></i><button id="rt" type="button" style="display:none">🔄 حاول تاني</button></div>
<button id="sw" type="button"></button>
<iframe id="f" allow="geolocation *; camera *; microphone *; clipboard-write *; fullscreen *"></iframe>
<script>
(function(){
var B="/wasel/",$=function(i){return document.getElementById(i)};
function g(k){try{return localStorage.getItem(k)}catch(e){return null}}
var city=g("wcity"),pg=g("wlast");
if(pg!=="courier.html")pg="customer.html";
var url=B+(city==="mhl"?"mh/app/":"app/")+pg;
var app=/WaselApp/.test(navigator.userAgent),f=$("f"),ld=$("ld"),started=false,tm=null;
function off(){ // مفيش نت: رسالة واضحة، وبنستنى النت يرجع لوحدنا
  ld.classList.remove("out");$("ic").textContent="📡";$("t1").textContent="انقطع الاتصال";
  $("t2").textContent="اتأكد من النت (واي فاي أو بيانات)… أول ما يرجع هنكمّل لوحدنا";
  $("sp").style.display="none";$("rt").style.display="block";
}
function go(){
  if(!navigator.onLine){off();return}
  $("ic").textContent="📶";$("t1").textContent="جاري الاتصال...";$("t2").textContent="ثواني ونرجعك لواصل";
  $("sp").style.display="block";$("rt").style.display="none";
  if(!app){location.replace(url);return} // من المتصفح: يفتح الصفحة على طول
  if(!started){started=true;f.src=url}else{try{f.contentWindow.location.reload()}catch(e){f.src=url}}
  clearTimeout(tm);tm=setTimeout(function(){if(!ld.classList.contains("out"))$("t2").textContent="النت بطيء شوية، ثواني..."},8000);
}
f.addEventListener("load",function(){f.style.display="block";setTimeout(function(){ld.classList.add("out")},500)});
window.addEventListener("offline",off);
window.addEventListener("online",function(){setTimeout(go,800)});
$("rt").onclick=go;
if(app){var s=$("sw");s.textContent="⇄ "+(pg==="courier.html"?"عميل":"مندوب");s.style.display="block";s.onclick=function(){try{WaselApp.switchRole()}catch(e){}}}
go();
})();
</script></body></html>
