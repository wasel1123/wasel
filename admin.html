<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e4f4c"><meta name="robots" content="noindex,nofollow">
<title>إدارة واصل</title>
<!-- ===== admin.html: لوحة إدارة واحدة لكل البلاد. تختار البلد وتختار «الإدارة» أو «غرفة العمليات» ===== -->
<style>
:root{--bg:#eef3f2;--fg:#13201f;--mu:#5f6f6d;--card:#fff;--ln:#dfe8e6;--br:#0e4f4c;--br2:#e3f0ee}
@media (prefers-color-scheme:dark){:root{--bg:#0d1514;--fg:#e8f0ef;--mu:#9db0ad;--card:#18211f;--ln:#26332f;--br2:#1d2e2b}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column;align-items:center}
header{width:100%;background:var(--br);color:#fff;padding:18px 16px 26px;text-align:center}
header b{font-size:22px;display:block}header small{opacity:.85}
main{width:100%;max-width:440px;padding:0 16px 30px;margin-top:-14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:16px;box-shadow:0 10px 26px rgba(14,79,76,.12)}
label{display:block;font-weight:800;font-size:14px;margin-bottom:8px;color:var(--mu)}
.cities{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.ct{border:2px solid var(--ln);border-radius:16px;padding:12px 8px;text-align:center;cursor:pointer;background:var(--card);color:var(--fg);font:inherit}
.ct span{font-size:30px;display:block}.ct b{display:block;font-size:16px}.ct small{color:var(--mu);font-size:12px}
.ct.on{border-color:var(--br);background:var(--br2)}
.go{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:16px;padding:16px;margin-bottom:10px;background:var(--br);color:#fff;font:inherit;font-weight:800;font-size:17px;cursor:pointer;text-align:right}
.go.b{background:#f2b544;color:#3b2300}.go span{font-size:26px}.go small{display:block;font-weight:600;font-size:12.5px;opacity:.85}
.note{font-size:12.5px;color:var(--mu);margin-top:10px;line-height:1.6}
</style></head><body>
<header><b>🛠 إدارة واصل</b><small>اختار البلد وافتح اللي محتاجه</small></header>
<main><div class="card">
<label>البلد</label>
<div class="cities" id="cities"></div>
<button class="go" id="gA" type="button"><span>📋</span><div>لوحة الإدارة<small id="sA"></small></div></button>
<button class="go b" id="gL" type="button"><span>🖥</span><div>غرفة العمليات<small id="sL"></small></div></button>
<div class="note">🔐 كل بلد ليها رمز دخول خاص بيها (لأن سيرفر كل بلد منفصل). لو حطيت نفس الرمز في الاتنين هتدخل بيه في الاتنين.<br>الصفحة بتفتكر آخر بلد اخترتها.</div>
</div></main>
<script>
(function(){
var C={unz:{n:"عنيزة",f:"🇸🇦",s:"السعودية",u:"https://script.google.com/macros/s/AKfycbwmS0DX-pqH17-cKKftKNqjVzD3lMuskpL8MvFKJpfSGt3uyVk5bli1dWeGOq782YbnLg/exec"},
       mhl:{n:"المحلة الكبرى",f:"🇪🇬",s:"مصر",u:"https://script.google.com/macros/s/AKfycbw6vRRRa_9l9K1OvtWcfQXyXBtrCY5wGXSsuSgx0eiUku0smp-Q6TLedPxq1_9blW1T/exec"}};
var cur="unz";try{var v=localStorage.getItem("wadm_city");if(C[v])cur=v}catch(e){}
var box=document.getElementById("cities");
function draw(){box.textContent="";Object.keys(C).forEach(function(k){var x=C[k],b=document.createElement("button");b.type="button";b.className="ct"+(k===cur?" on":"");
  b.innerHTML="<span></span><b></b><small></small>";b.children[0].textContent=x.f;b.children[1].textContent=x.n;b.children[2].textContent=x.s;
  b.onclick=function(){cur=k;try{localStorage.setItem("wadm_city",k)}catch(e){}draw()};box.appendChild(b)});
  document.getElementById("sA").textContent="الطلبات والمناديب والعروض · "+C[cur].n;document.getElementById("sL").textContent="الخريطة الحية لحظة بلحظة · "+C[cur].n}
draw();
document.getElementById("gA").onclick=function(){location.href=C[cur].u+"?page=admin"};
document.getElementById("gL").onclick=function(){location.href=C[cur].u+"?page=live"};
})();
</script>
</body></html>
