<script>/* وضع العرض: فاتح افتراضيًا، والعميل يختار الغامق بزر ☀️/🌙 ويُحفظ على جهازه، ومع كل تغيير زر «تراجع» */
(function(){var d=document.documentElement;try{if(localStorage.getItem("wth")==="dark")d.classList.add("dk");if(localStorage.getItem("wgd")==="f")d.classList.add("pk")}catch(e){}
var TT=0;function en(){return d.lang==="en"}
window.waselToast=function(msg,undoTxt,undo){var t=document.getElementById("wtoast");if(!t){t=document.createElement("div");t.id="wtoast";t.setAttribute("role","status");document.body.appendChild(t)}
t.textContent="";var s=document.createElement("span");s.textContent=msg;t.appendChild(s);
if(undo){var u=document.createElement("button");u.type="button";u.textContent=undoTxt;u.onclick=function(){clearTimeout(TT);t.className="";undo()};t.appendChild(u)}
t.className="on";clearTimeout(TT);TT=setTimeout(function(){t.className=""},6000)};
document.addEventListener("DOMContentLoaded",function(){var h=document.querySelector("header");if(!h)return;
var b=document.createElement("button");b.type="button";b.className="thm";
function ui(){var k=d.classList.contains("dk");b.textContent=k?"☀️":"🌙";b.title=k?(en()?"Light mode":"الوضع الفاتح"):(en()?"Dark mode":"الوضع الداكن");b.setAttribute("aria-label",b.title)}
function setDk(k){d.classList.toggle("dk",k);try{localStorage.setItem("wth",k?"dark":"light")}catch(e){}ui()}
b.onclick=function(){var was=d.classList.contains("dk");setDk(!was);
 waselToast(!was?(en()?"✓ Dark mode on":"✓ اتحوّل للوضع الداكن"):(en()?"✓ Light mode on":"✓ اتحوّل للوضع الفاتح"),en()?"↩ Undo":"↩ تراجع",function(){setDk(was)})};ui();
var l=h.querySelector("#lang");if(l&&l.parentNode)l.parentNode.insertBefore(b,l);else h.appendChild(b)})})();
</script>
<script>/* زر «غيّر مودك / غيّري مودك»: يبدّل شكل التطبيق بين الأخضر والبينك، ويتحفظ على الجهاز بس (مش بيتبعت للسيرفر)، ومعاه «تراجع» */
(function(){var d=document.documentElement;
function en(){return d.lang==="en"}
function get(){try{return localStorage.getItem("wgd")||""}catch(e){return ""}}
function lbl(b){var f=get()==="f",t=en()?"🎨 Change your look":(f?"🎨 غيّري مودك":"🎨 غيّر مودك");b.textContent=t;b.title=t;b.setAttribute("aria-label",t)}
window.waselGender=function(v,silent){var prev=get();try{if(v)localStorage.setItem("wgd",v);else localStorage.removeItem("wgd")}catch(e){}
 d.classList.toggle("pk",v==="f");Array.prototype.forEach.call(document.querySelectorAll(".gnd"),lbl);
 try{document.dispatchEvent(new CustomEvent("waselgender",{detail:{v:v,prev:prev}}))}catch(e){}
 if(!silent&&window.waselToast)waselToast(v==="f"?(en()?"✓ Pink look on":"✓ اتحوّل للون البينك"):(en()?"✓ Wasel green look on":"✓ اتحوّل للون واصل الأخضر"),en()?"↩ Undo":"↩ تراجع",function(){window.waselGender(prev,true)})};
document.addEventListener("DOMContentLoaded",function(){var h=document.querySelector("header");if(!h)return;
 var b=document.createElement("button");b.type="button";b.className="thm gnd";lbl(b);
 b.onclick=function(){window.waselGender(get()==="f"?"m":"f")};
 var t=h.querySelector(".thm");if(t&&t.parentNode)t.parentNode.insertBefore(b,t);else h.appendChild(b);
 var l=document.getElementById("lang");if(l)l.addEventListener("click",function(){setTimeout(function(){lbl(b)},0)})})})();
</script>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;line-height:1.55;font-size:15px}

button{font:inherit;cursor:pointer}
.btn{width:auto;margin:0;padding:8px 14px;border:0;border-radius:12px;background:var(--br);color:#fff;font-weight:700;font-size:14px}
.btn.sec{background:var(--br2);color:var(--br)}.btn.bad{background:var(--bad);color:#fff}.btn.sm{padding:5px 10px;font-size:13px}.btn:disabled{opacity:.55}

.alert.red{background:#fef2f2;border-color:#fca5a5;color:#7f1d1d}:where(html.dk) .alert.red{background:#2c1415;border-color:#991b1b;color:#fecaca}
.alert .t{flex:1}.alert.good{background:#f0fdf4;border-color:#86efac;color:#14532d}:where(html.dk) .alert.good{background:#10241a;border-color:#166534;color:#bbf7d0}

.oc .r1{display:flex;justify-content:space-between;gap:6px;font-weight:700;font-size:13.5px}.oc .r2{font-size:13px;color:var(--mu);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oc.late{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad) inset}

.pill.new{background:#fdf1d8;color:#5c3a00}.pill.go{background:#bae6fd;color:#075985}.pill.way{background:#ddd6fe;color:#4c1d95}.pill.dest{background:#fbcfe8;color:#831843}.pill.done{background:#bbf7d0;color:#14532d}.pill.x{background:#fecaca;color:#7f1d1d}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:8px}.bars div{flex:1;text-align:center;font-size:11.5px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:var(--br);border-radius:6px 6px 0 0;min-height:2px;margin-bottom:3px}.bars b{color:var(--tx);font-size:12px}

.chat{border:1px solid var(--ln);border-radius:10px;padding:8px;margin-bottom:10px;background:var(--card)}

.msg{display:flex;gap:8px;padding:3px 0;font-size:13.5px}.msg time{color:var(--mu);font-size:11.5px;min-width:38px}.msg .w{font-weight:700;min-width:50px}.msg.blocked{background:#fef2f2;border-radius:6px;padding:3px 6px;color:#7f1d1d}
:where(html.dk) .msg.blocked{background:#2c1415;color:#fecaca}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:14px}

.msg.adm{background:rgba(242,181,68,.18)}
:where(html.dk) .btn,:where(html.dk) .chips button.on{color:#06201d}:where(html.dk) .btn.bad{color:#fff}:where(html.dk) .btn.sec{color:var(--br)}

:root{color-scheme:light}html.dk{color-scheme:dark}

/* كلام أوضح: خط عريض في التطبيق كله، مع عمق خفيف للعناوين */
body{font-weight:700}

}

.tmrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--ln,#e5e7eb);cursor:pointer;font-size:14px}

function lateInfo(o){ // يرجع نصًا لو الطلب متأخر

  if(s==="accepted"&&mins(o.tu)>=25)return "قبل ولم يصل للمطعم منذ "+dur(mins(o.tu));
  if((s==="arrived"||s==="invoiced")&&mins(o.tArr)>=40)return "عند المطعم منذ "+dur(mins(o.tArr));
  if((s==="picked"||s==="ontheway")&&mins(o.tPick||o.tu)>=45)return "في الطريق منذ "+dur(mins(o.tPick||o.tu));
  if(s==="atdest"&&mins(o.tDest)>=15)return "عند العميل منذ "+dur(mins(o.tDest))+" ولم يُسلَّم";

function inRange(ms,r){if(r==="all")return true;if(!ms)return false;if(r==="today")return dk(ms)===dk(D.now);return ms>=D.now-Number(r)*86400000}

function call(fn,args,ok,fail){
  var g=google.script.run.withSuccessHandler(function(r){
    if(r&&r.ok===false&&/رمز|محاولات|الإدارة/.test(r.msg||"")&&!/اسم|مبلغ|مندوب/.test(r.msg||"")&&fn==="adminData"){logout(r.msg);return}
    ok&&ok(r)}).withFailureHandler(function(){fail?fail():setStat("تعذر الاتصال",1)});
  g[fn].apply(g,args)}
function setStat(t,bad){$("stat").innerHTML="";var d=el("span","dot"+(bad?" off":""));$("stat").appendChild(d);$("stat").appendChild(document.createTextNode(t))}
function load(force){
  if(!CODE||loading)return;if(!force&&document.hidden)return;

  call("adminData",[CODE],function(r){loading=false;
    if(!r||!r.ok){logout(r&&r.msg);return}
    D=r;setStat("آخر تحديث "+tm(D.now)+":"+("0"+new Date(D.now).getSeconds()).slice(-2));render();loadInbox();loadReg();loadPres();loadRst();loadTimes()},
  function(){loading=false;setStat("تعذر التحديث، تأكد من الإنترنت",1)})}

function tmFmt(s){var m=Math.floor(s/60),x=s%60;return (m<10?"0":"")+m+":"+(x<10?"0":"")+x}
function timesCard(){
  var c=el("div","card");if(!TMS||!TMS.list)return el("div");
  var act=TMS.list.filter(function(o){return !o.done}),dn=TMS.list.filter(function(o){return o.done});
  c.appendChild(el("h3",null,"⏱ وقت التوصيل"));
  if(!act.length)c.appendChild(el("div","mu","مفيش طلبات شغالة دلوقتي"));

    r.appendChild(el("b",null,o.no.replace(/^orderWASEL-/i,"#")));r.appendChild(el("span",null,o.courier||"-"));
    var k=el("span","atm","00:00");k.dataset.acc=o.acc;r.appendChild(k);
    var age=o.loc?Math.round((TMS.now-o.loc)/60000):-1;
    r.appendChild(el("span","tmloc "+(age<0||age>=3?"bad":age>=1?"mid":"ok"),age<0?"⚪ مفيش موقع":age<1?"🟢 مباشر":(age>=3?"⚠️ ":"🟡 ")+"من "+age+" د"));
    r.onclick=function(){openOrder(o.no)};c.appendChild(r)});
  if(dn.length){var tot=0;dn.forEach(function(o){tot+=(o.done-o.acc)/60000});
    c.appendChild(el("div","mu","✅ آخر 24 ساعة: "+dn.length+" طلب اتسلّم، متوسط التوصيل "+Math.round(tot/dn.length)+" دقيقة"))}
  setTimeout(tmTick,0);return c}

setInterval(tmTick,1000);

/* ===== تنبيه صوتي: طلب جديد بلا مندوب / متأخر / رسالة تنتظر ردك ===== */
function unlockA(){try{if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==="suspended")AC.resume()}catch(e){}}
document.addEventListener("pointerdown",unlockA,{passive:true});
function sndBtn(){$("snd").textContent=SND?"🔔":"🔕"}
function beepA(){
  try{navigator.vibrate&&navigator.vibrate([500,150,500,150,500])}catch(e){}
  if(!SND||!AC||AC.state!=="running")return;
  try{[0,.3,.6,.9,1.2,1.5].forEach(function(d,i){var o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+d;
    o.type="square";o.frequency.value=i%2?1320:880;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.9,n+.02);g.gain.exponentialRampToValueAtTime(.0001,n+.26);
    o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+.28)})}catch(e){}}
function checkSound(){
  if(!D)return;
  var cur={},lbl={};
  D.orders.forEach(function(o){
    var s=sk(o);
    if(s==="new"&&o.sent){cur["w"+o.no]=1;lbl["w"+o.no]="طلب جديد بلا مندوب"}
    var l=lateInfo(o);if(l&&(s==="new"||s==="atdest")){cur["l"+o.no]=1;lbl["l"+o.no]="طلب متأخر"}});
  if(INBX)INBX.threads.forEach(function(th){if(threadWait(th)){var k="m"+th.name+th.list[th.list.length-1].t;cur[k]=1;lbl[k]="رسالة جديدة"}});
  if(REG)REG.list.forEach(function(x){if(x.status==="جديد"){cur["g"+x.no]=1;lbl["g"+x.no]="طلب تسجيل مندوب جديد"}});
  if(RST)RST.list.forEach(function(x){if(x.state==="pending"){cur["r"+x.name]=1;lbl["r"+x.name]="طلب تسجيل مطعم جديد"}});
  if(SEENK===null){SEENK=cur;return}
  var nw=null;for(var k in cur){if(!SEENK[k]){nw=lbl[k];break}}
  SEENK=cur;
  if(nw){beepA();try{document.title="🔔 "+nw}catch(e){}}}

/* ===== التبويبات ===== */
function attention(){
  var a=[];
  D.orders.forEach(function(o){
    var l=lateInfo(o);if(l)a.push({lvl:sk(o)==="new"||sk(o)==="atdest"?"red":"warn",txt:o.no+" ("+(o.pickupName||"-")+"): "+l,no:o.no});
    if(isUnpaid(o)&&/لم يُستلم|لم يستلم/.test(o.proof)&&!/حصّلته/.test(o.proof))a.push({lvl:"red",txt:o.no+": سُلّم بدون استلام المبلغ ("+mo(o.total)+") — راجعه",no:o.no});
    if(o.status==="تم التسليم"&&inRange(o.tu,"1")&&((o.rsvc>0&&o.rsvc<=2)||(o.rcour>0&&o.rcour<=2)))a.push({lvl:"warn",txt:o.no+": تقييم منخفض (الخدمة "+o.rsvc+" / المندوب "+o.rcour+")"+(o.rnote?" — "+o.rnote:""),no:o.no})});
  var nb=D.chat.filter(function(m){return m.blocked&&m.t>=D.now-86400000}).length;
  if(nb)a.push({lvl:"warn",txt:"🚫 "+nb+" محاولة رسالة محظورة (أرقام/حسابات تواصل) آخر 24 ساعة",tab:"ch"});
  return a}
function tabs(){
  var att=attention().filter(function(x){return x.lvl==="red"}).length;
  var nb=D.chat.filter(function(m){return m.blocked&&m.t>=D.now-86400000}).length;
  var T=[["ov","نظرة عامة",att],["or","الطلبات",0],["co","المناديب",0],["ch","المحادثات",nb],["in","الرسائل",pendingIn()],["rg","طلبات المناديب",REG?REG.pending:0],["rs","المطاعم",RST?RST.pending:0],["st","المتاجر",0],["of","العروض 🔥",OFL&&OFL.list?OFL.list.filter(function(x){return x.st==="مقترح"}).length:0],["pa","التسويات",0],["ac","المحاسبة",0],["pl","📘 دراسة المشروع",0]];
  var n=$("tabs");n.textContent="";
  T.forEach(function(t){var b=el("button",TAB===t[0]?"on":"",t[1]);if(t[2]){b.appendChild(el("span","n",String(t[2])))}b.onclick=function(){TAB=t[0];render();if(t[0]==="ac")loadAcc();if(t[0]==="st")loadSt();if(t[0]==="of")loadOf()};n.appendChild(b)})}
function render(){
  if(!D)return;
  checkSound();
  tabs();
  var ae=document.activeElement;

<script>
/* ===== 📞 نغمة التنبيه: رنّة تليفون (رنّتين سريعتين) لكل التنبيهات ===== */
(function(){
function ring(){
  try{navigator.vibrate&&navigator.vibrate([400,120,400,120,400])}catch(e){}
  try{if(typeof SND!=="undefined"&&!SND)return}catch(e){}
  var A=null;try{A=AC}catch(e){}
  try{if(!A){var C=window.AudioContext||window.webkitAudioContext;if(!C)return;A=new C();try{AC=A}catch(e){}}if(A.state==="suspended")A.resume()}catch(e){return}
  try{var t0=A.currentTime+.03;
    [0,1.2].forEach(function(st){var s=t0+st,o1=A.createOscillator(),o2=A.createOscillator(),g1=A.createGain(),g2=A.createGain(),m=A.createGain();
      o1.type="triangle";o2.type="sine";o1.connect(g1);o2.connect(g2);g1.connect(m);g2.connect(m);m.connect(A.destination);g1.gain.value=1;g2.gain.value=.35;
      m.gain.setValueAtTime(.0001,s);m.gain.exponentialRampToValueAtTime(.45,s+.02);m.gain.setValueAtTime(.45,s+.88);m.gain.exponentialRampToValueAtTime(.0001,s+.96);
      for(var k=0;k<32;k++){var tt=s+k*.03;o1.frequency.setValueAtTime(k%2?1560:1240,tt);o2.frequency.setValueAtTime(k%2?3120:2480,tt)}
      o1.start(s);o2.start(s);o1.stop(s+.98);o2.stop(s+.98)})}catch(e){}}
if(typeof window.beep==="function")window.beep=ring;
if(typeof window.beepA==="function")window.beepA=ring;
})();
</script>
