(function(){

function sv(v){try{localStorage.setItem(K,v)}catch(e){}}
var page=location.pathname.split("/").pop()||"customer.html",c=g();
// آخر صفحة اتفتحت (عميل/مندوب): علشان لو النت فصل ورجع، التطبيق يرجع لنفس الصفحة

   وعنيزة زي ما هي. الإعدادات العامة (المدينة واللغة والوضع الداكن والمود والصوت) مشتركة */
if(ME!=="unz"){try{var SP=Storage.prototype,PF=ME==="mhl"?"mh_":ME+"_",SH={wcity:1,wcity_nb:1,wl:1,wth:1,wgd:1,wss:1,ws:1,wloc:1};
  var gi=SP.getItem,si=SP.setItem,ri=SP.removeItem;
  function key(st,k){return (st===window.localStorage&&!SH[k])?PF+k:k}
  SP.getItem=function(k){return gi.call(this,key(this,String(k)))};
  SP.setItem=function(k,v){return si.call(this,key(this,String(k)),v)};
  SP.removeItem=function(k){return ri.call(this,key(this,String(k)))}}catch(e){}}
function go(v){sv(v);if(v!==ME)location.replace(C[v].p+page+location.search);else{var o=document.getElementById("wcity");if(o)o.remove()}}
function km(a,b,c2,d){var r=Math.PI/180,x=(c2-a)*r,y=(d-b)*r,h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c2*r)*Math.sin(y/2)*Math.sin(y/2);return 12742*Math.asin(Math.sqrt(h))}

function show(first){
  var o=document.getElementById("wcity");if(o)o.remove();
  o=el("div","position:fixed;inset:0;z-index:2147483000;background:#0e4f4c;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;font-family:inherit;direction:rtl");o.id="wcity";
  var box=el("div","width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;align-items:stretch");o.appendChild(box);
  function perm(){box.textContent="";
    box.appendChild(el("div","font-size:60px","📍"));

    var a=el("button","border:0;border-radius:16px;padding:14px;background:#f2b544;color:#1b1200;font:inherit;font-weight:800;font-size:17px;margin-top:6px","سماح بالموقع");a.type="button";

  var o=el("div","position:fixed;top:8px;left:8px;right:8px;z-index:2147482000;background:#f2b544;color:#1b1200;border-radius:16px;padding:12px 14px;box-shadow:0 6px 20px rgba(0,0,0,.3);direction:rtl;font-family:inherit;display:flex;flex-direction:column;gap:8px");o.id="wcity_nb";

  var a=el("button","flex:1;border:0;border-radius:12px;padding:10px;background:#0e4f4c;color:#fff;font:inherit;font-weight:800","🔄 افتح واصل "+C[k].n);a.type="button";a.onclick=function(){go(k)};
  var x=el("button","border:0;border-radius:12px;padding:10px 14px;background:rgba(0,0,0,.08);color:#1b1200;font:inherit","✕");x.type="button";x.setAttribute("aria-label","إخفاء");
  x.onclick=function(){o.remove();try{sessionStorage.setItem("wcity_nb",k)}catch(e){}};
  row.appendChild(a);row.appendChild(x);o.appendChild(t);o.appendChild(row);document.body.appendChild(o)}
function chk(p){try{if(document.getElementById("wcity"))return;var la=p.coords.latitude,ln=p.coords.longitude;
  for(var k in C)if(k!==ME&&km(la,ln,C[k].la,C[k].ln)<=C[k].km){banner(k);return}}catch(e){}}

  G.getCurrentPosition=function(s,e,o){return gc(function(p){chk(p);if(s)s(p)},e,o)};
  G.watchPosition=function(s,e,o){return wp(function(p){chk(p);if(s)s(p)},e,o)}}}catch(e){}
document.addEventListener("DOMContentLoaded",function(){
  if(!g())show(true);
  // زرار «🌍 غيّر المدينة» في القايمة ☰

function toggle(f){box.classList.toggle("open",f);if(box.classList.contains("open")){var on=list.querySelector(".on");if(on)list.scrollTop=on.offsetTop-list.offsetTop-60}}
cur.addEventListener("click",function(){toggle()});
cur.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle()}});
list.addEventListener("click",function(e){var r=e.target.closest(".pkr[data-i]");if(!r)return;
  pk.selectedIndex=+r.dataset.i;pk.dispatchEvent(new Event("change",{bubbles:true}));toggle(false);draw()});
new MutationObserver(function(){setTimeout(draw,0)}).observe(pk,{childList:true,attributes:true,attributeFilter:["class"]});
pk.addEventListener("change",function(){setTimeout(draw,0)});
var s=document.getElementById("pks");if(s){s.addEventListener("input",function(){toggle(!!s.value.trim())});s.addEventListener("focus",function(){if(s.value.trim())toggle(true)})}
/* تغيير القيمة من الكود (زي اختيار عرض) */
var d=Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,"value");
if(d&&d.set)Object.defineProperty(pk,"value",{get:function(){return d.get.call(pk)},set:function(v){d.set.call(pk,v);setTimeout(draw,0)},configurable:true});
var lb=document.getElementById("lang");if(lb)lb.addEventListener("click",function(){setTimeout(draw,150)});
setInterval(function(){var t=pk.selectedIndex+"|"+pk.options.length+"|"+(window.SLOGO?Object.keys(SLOGO).length:0);if(t!==box._t){box._t=t;draw()}},1500);
draw();
})();
