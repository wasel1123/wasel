var D={
"terms-customer":["الشروط والأحكام للعملاء",[
 ["من نحن","«واصل» خدمة توصيل طلبات داخل مدينة عنيزة. نحن نربطك بمندوب توصيل مستقل ينفّذ طلبك من المطعم أو المتجر إليك. باستخدامك الخدمة وإرسال طلب فأنت توافق على هذه الشروط."],
 ["الطلب والسعر",["تُحدَّد رسوم التوصيل وتظهر لك قبل تأكيد الطلب. وقد تتغير حسب المسافة أو العروض.","قيمة الطلب نفسه (الوجبة أو المشتريات) هي المكتوبة في فاتورة المطعم أو المتجر، ويدفعها العميل كما هي.","قد يضيف المندوب أو الإدارة تعديلًا بعد الاتفاق معك إذا تغيّرت الأصناف أو الأسعار."]],
 ["الدفع",["الدفع كاش فقط خلال فترة التجربة، وبيكون عند استلام الطلب.","طرق الدفع الإلكتروني هتتاح بعد التسجيل الرسمي للخدمة، وهنبلّغك بيها داخل التطبيق. لا تحوّل أي مبلغ لأي رقم يُرسل لك من خارج الخدمة."]],
 ["دقة البيانات",["أنت مسؤول عن صحة الاسم ورقم الجوال والعنوان أو الموقع على الخريطة.","الجوال لازم يكون متاحًا أثناء التوصيل. إذا تعذر الوصول إليك بعد محاولات معقولة فقد يُلغى الطلب ويُحاسَب عليه إن كان قد تم تجهيزه."]],
 ["الإلغاء",["يمكنك طلب الإلغاء قبل أن يستلم المندوب الطلب من المكان، عبر التواصل مع الإدارة.","بعد تجهيز الطلب أو استلامه قد لا يمكن الإلغاء أو قد تتحمل قيمته."]],
 ["التأخير والمسؤولية",["المدة المعروضة تقديرية وتتأثر بالتجهيز في المطعم والزحام.","المطعم أو المتجر مسؤول عن جودة الطلب ومكوناته (بما فيها الحساسية الغذائية)، ودورنا نقل الطلب. ننظر في أي شكوى بجدّية ونحاول الحل مع الطرف المعني.","لا نتحمل ضررًا ناتجًا عن بيانات خاطئة قدّمها العميل أو عن ظروف خارجة عن إرادتنا."]],
 ["التتبع",["أثناء تنفيذ طلبك قد ترى موقع المندوب على الخريطة ليساعدك على متابعته. ينتهي ظهور الموقع عند انتهاء الطلب."]],
 ["ممنوعات","لا نوصّل ممنوعات نظامًا (مثل الكحول والمخدرات والأسلحة)، ولا أي شيء مخالف لأنظمة المملكة. يحق لنا رفض أي طلب أو إيقاف الخدمة عمّن يسيء استخدامها أو يتعامل بعنف أو إساءة مع المندوبين."],
 ["التقييم والشكاوى","يمكنك تقييم الخدمة بعد التسليم، ونستخدم التقييم لتحسين الجودة. للشكاوى تواصل معنا عبر وسائل التواصل المذكورة أسفل الصفحة."],
 ["التعديل والنظام","قد نحدّث هذه الشروط من وقت لآخر، واستمرارك في استخدام الخدمة يعني قبولك للنسخة المحدثة. تخضع هذه الشروط لأنظمة المملكة العربية السعودية."]

"privacy-customer":["سياسة الخصوصية للعملاء",[
 ["ما الذي نجمعه",["الاسم ورقم الجوال.","العنوان أو الموقع على الخريطة الذي تحدده للتوصيل.","تفاصيل الطلب (الأصناف، الملاحظات، طريقة الدفع، المبالغ).","التقييم إن أرسلته، وصورة إثبات الدفع أو الفاتورة عند الحاجة."]],
 ["لماذا نستخدمها","لتنفيذ طلبك وإيصاله، والتواصل معك بشأنه، والمحاسبة مع المناديب والمطاعم، وحل الشكاوى والنزاعات، وتحسين الخدمة، والالتزام بالأنظمة."],
 ["من يطّلع عليها",["المندوب الذي ينفّذ طلبك: يرى اسمك وعنوانك وموقعك فقط لتنفيذ الطلب. رقم جوالك مخفي عنه، والتواصل بينكما يتم بالمحادثة داخل واصل، والمحادثات محفوظة وتراجعها الإدارة عند الحاجة.","المطعم أو المتجر: يرى تفاصيل الطلب اللازمة للتجهيز.","الإدارة: لمتابعة التشغيل والمحاسبة وخدمة العملاء.","نستخدم خدمات تقنية لتشغيل الخدمة: Google (التخزين والتشغيل) وتيليجرام (إشعارات الفريق). لا نبيع بياناتك ولا نشاركها لأغراض إعلانية."]],
 ["بياناتك على جهازك","قد يحفظ المتصفح على جهازك بياناتك (الاسم والجوال والعنوان) لتسهيل طلبك القادم. يمكنك مسحها بزر «انسَ بياناتي» داخل الصفحة أو من إعدادات المتصفح."],
 ["مدة الاحتفاظ","نحتفظ بسجل الطلبات للمدة اللازمة للمحاسبة وحل النزاعات والالتزام بالأنظمة، ثم نحذفها أو نُخفي هويتها."],
 ["حقوقك","يحق لك طلب الاطلاع على بياناتك أو تصحيحها أو حذفها، وسحب موافقتك على استخدامها، ما لم يمنع نظام أو التزام محاسبي ذلك. تواصل معنا عبر وسائل التواصل أسفل الصفحة."],

"terms-courier":["شروط وأحكام المناديب",[
 ["الانضمام",["يشترط أن يكون عمرك 18 عامًا فأكثر، وأن يكون لديك حق قانوني في العمل بالتوصيل، ووسيلة نقل صالحة ورخصة قيادة سارية إن لزم، وجوال تعمل عليه صفحة المندوب.","تُراجَع بيانات التسجيل، ويحق للإدارة قبول الطلب أو رفضه أو إيقاف الحساب."]],
 ["طبيعة العمل","تعمل بقبول الطلبات التي تناسبك من صفحة المندوب. أجرك عن كل طلب يظهر لك قبل القبول. هذه الشروط لا تعني بذاتها علاقة توظيف، وقد تتغير الصياغة بعد استكمال التسجيل الرسمي لـ«واصل»."],
 ["التزامات المندوب",["قبول الطلب التزام: لا تقبل ما لا تستطيع تنفيذه.","التعامل باحترام مع العملاء والمطاعم وفريق واصل.","الاستلام والتسليم بعناية وبدون فتح الطلب أو العبث به.","رفع الفاتورة وإثبات التسليم عندما يطلبها التطبيق، وبدقة.","الالتزام بأنظمة المرور والسلامة وعدم استخدام الجوال أثناء القيادة."]],
  ["الموقع",["يطلب التطبيق مشاركة موقعك الدقيق أثناء الطلبات النشطة ليتابعها العميل والإدارة، ويُسجَّل الوصول تلقائيًا عند الاقتراب من نقطة التسليم.","لا يُنفَّذ الطلب إذا كان الموقع مغلقًا أو غير دقيق.","لا نستخدم الموقع لأي غرض آخر غير تشغيل الطلبات والأمان وحل النزاعات."]],
 ["المبالغ والكاش",["رصيدك في «محفظتي» يوضّح ما لك وما عليك. إذا استلمت مبلغ الطلب كاشًا فتُخصم حصة التطبيق من رصيدك، ويُسجَّل لك الباقي كما في المحفظة.","الكاش الذي معك للتطبيق أمانة، ويجب تسليمه في موعد التسوية (كل 3 أيام عادةً).","قد يُوقَف استقبال الطلبات الجديدة مؤقتًا إذا بلغ المبلغ الذي عليك للتطبيق الحد المسموح، ويُفتح فور تسليمه.","الإدارة هي التي تسجّل التسوية، وكل حركة تظهر في محفظتك."]],
 ["بيانات الحساب",["إدخال الآيبان أو STC Pay اختياري لاستلام مستحقاتك، وعليك التأكد من صحته. نحوّل لما ورد باسم صاحب الحساب فقط.","نحن غير مسؤولين عن تحويل صحيح وقع على بيانات أخطأت أنت في كتابتها."]],
 ["المخالفات",["يمنع الغش أو التلاعب بالموقع أو الفواتير أو المبالغ أو العمل بحساب غيرك.","يحق للإدارة التنبيه أو الإيقاف المؤقت أو الدائم عند المخالفة، ويحق لها خصم أو استرداد المبالغ المستحقة نظامًا."]],
 ["التأمين والمسؤولية","أنت مسؤول عن مركبتك ومخالفاتك المرورية وسلامتك. تحقق من تغطية التأمين المناسبة لعملك. نحن لسنا مسؤولين عن حوادث الطريق ما لم يُنص على غير ذلك نظامًا."],
 ["إنهاء التعاون","يمكنك التوقف في أي وقت بعد تسوية ما عليك وما لك. ويحق للإدارة إنهاء التعاون عند الإخلال بهذه الشروط."],
 ["التعديل والنظام","قد نحدّث هذه الشروط، وتخضع لأنظمة المملكة العربية السعودية."]
]],
"privacy-courier":["سياسة الخصوصية للمناديب",[

 ["صور المستندات","صور الإقامة (أو الهوية) والاستمارة والرخصة تُستخدم للتحقق من أهليتك للعمل فقط، وتُحفظ بشكل خاص لدى الإدارة ولا تُعرض للعملاء ولا للمناديب الآخرين. لا نشاركها مع أي جهة إلا إذا طلبتها جهة رسمية مختصة نظامًا."],
 ["لماذا نستخدمها","لتوزيع الطلبات وتتبعها، وحساب أجرك ومستحقاتك وتحويلها، ومنع الغش، وخدمة العملاء، والالتزام بالأنظمة."],
 ["من يطّلع عليها",["العميل: يرى اسمك وموقعك أثناء طلبه فقط.","الإدارة: ترى بياناتك وسجل عملك للتشغيل والمحاسبة.","بيانات حسابك البنكي تظهر لك مخفية جزئيًا، ولا يطّلع عليها غير الإدارة المخولة.","نستخدم Google للتخزين والتشغيل وتيليجرام لإشعارات الفريق. لا نبيع بياناتك."]],
 ["مدة الاحتفاظ","نحتفظ بسجل عملك وتسوياتك للمدة اللازمة للمحاسبة والنظام. صور المستندات تُحفظ طوال فترة تعاملك معنا، ثم تُحذف خلال مدة معقولة بعد انتهائه ما لم يوجب النظام غير ذلك. موقعك اللحظي لا يُحفظ إلا مؤقتًا."],

"terms-restaurant":["شروط وأحكام المطاعم والمتاجر",[
 ["من نحن","«واصل» خدمة توصيل طلبات داخل مدينة عنيزة، تربط مطعمك أو متجرك بالعملاء وبمناديب توصيل مستقلين. هذه الشروط تنطبق على كل مطعم أو متجر أو صاحب أكل بيتي يسجّل معنا ويستخدم صفحة المطعم. بتسجيلك واستخدامك الصفحة فأنت توافق عليها."],
 ["التسجيل والاعتماد",["يشترط أن يكون النشاط مرخّصًا نظامًا (سجل تجاري أو ترخيص مناسب لنوع النشاط) وملتزمًا بالاشتراطات الصحية والبلدية.","تراجع الإدارة طلب التسجيل، ويحق لها قبوله أو رفضه أو طلب مستندات إضافية.","بعد الاعتماد يصلك رمز دخول خاص بمطعمك. لا تشاركه إلا مع المسؤولين عندك، وأنت مسؤول عن أي استخدام له."]],
 ["الموقع",["تحدّد موقع مطعمك بنفسك من صفحتك، ويجب أن يكون داخل عنيزة ودقيقًا، لأنه الموقع الذي يتجه إليه المندوب ويظهر للعميل."]],
 ["المنيو والأسعار والصور",["تضيف أصنافك وأسعارك وعروضك بنفسك، وأنت مسؤول عن دقتها وتحديثها.","صورة كل صنف إلزامية، ويجب أن تكون صورة حقيقية للصنف نفسه، ومملوكة لك أو مسموحًا لك باستخدامها.","السعر في المنيو يجب أن يطابق سعرك المعتاد في المحل. الفاتورة التي تسلمها للمندوب هي المرجع النهائي لقيمة الطلب.","أوقف الصنف من صفحتك فور نفاده، واقفل المطعم من الصفحة وقت الإغلاق حتى لا تصلك طلبات."]],
 ["استقبال الطلبات",["تصلك الطلبات على صفحة المطعم، ويمكن أن يصلك تنبيه على تليجرام.","اقبل الطلب مع تحديد وقت التجهيز، أو اعتذر عنه مع ذكر السبب، في أسرع وقت.","اضغط «الطلب جاهز» عندما يكون جاهزًا فعلًا للاستلام، وسلّمه للمندوب مغلقًا ومع فاتورته.","تكرار التأخير أو الاعتذار بدون سبب أو عدم الرد قد يؤدي إلى إيقاف ظهور المطعم مؤقتًا."]],
 ["الجودة والمسؤولية",["المطعم أو المتجر مسؤول عن جودة الطلب ونظافته وسلامته ومكوناته، ومنها مسببات الحساسية، وعن تغليفه بشكل مناسب للتوصيل.","دور واصل نقل الطلب. عند وجود شكوى تخص الطلب نفسه نتواصل معك لحلها مع العميل بشكل عادل."]],
 ["الدفع والتسوية",["خلال فترة التجربة الحالية يدفع المندوب قيمة فاتورة الطلب للمطعم عند الاستلام، إلى أن يتم ربط الدفع الإلكتروني رسميًا.","فترة التجربة (شهر تقريبًا) بدون عمولة على المطعم. بعدها يتم الاتفاق مع كل مطعم على رسم ثابت لكل طلب أو أي ترتيب آخر، ولا يُطبَّق أي رسم إلا بعد إبلاغك والاتفاق معك.","تظهر طلبات واصل لمطعمك في تقارير الإدارة، وتتم التسوية حسب ما يتم الاتفاق عليه."]],
 ["الظهور في التطبيق","يظهر مطعمك للعملاء في قائمة المطاعم بالاسم والتصنيف والمنيو والصور والموقع. يحق لواصل ترتيب طريقة العرض والتصنيفات بما يخدم العملاء."],
 ["المخالفات والإيقاف",["يمنع رفع أسعار أو صور غير حقيقية، أو بيع أي شيء ممنوع نظامًا، أو التعامل بإساءة مع المناديب أو العملاء.","يحق للإدارة التنبيه أو الإيقاف المؤقت أو الدائم عند المخالفة."]],
 ["إنهاء التعاون","يمكنك طلب إيقاف ظهور مطعمك في أي وقت بعد تسوية ما لك وما عليك، ويحق لواصل إنهاء التعاون عند الإخلال بهذه الشروط."],
 ["التعديل والنظام","قد نحدّث هذه الشروط، ونبلغك بأي تغيير مهم يخص الرسوم قبل تطبيقه. تخضع هذه الشروط لأنظمة المملكة العربية السعودية."]
]],
