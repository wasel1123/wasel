<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>واصل | Wasel</title>
<meta name="theme-color" content="#0f766e" id="tc">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" id="ati" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="واصل Wasel">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
html,body{margin:0;height:100%;background:#0f766e;overflow:hidden;font-family:Tahoma,Arial,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
.hide{display:none!important}
#pick{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;box-sizing:border-box;background:linear-gradient(160deg,#0b5e57,#0f766e 55%,#14a79a);color:#fff;text-align:center;overflow:auto}
#pick .logo{width:104px;height:104px;border-radius:26px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#pick h1{margin:4px 0 0;font-size:32px;line-height:1.2}#pick h1 small{display:block;font-size:17px;font-weight:400;letter-spacing:3px;opacity:.85}
#pick p{margin:0 0 8px;opacity:.9;font-size:15px}
#lg{position:absolute;top:calc(14px + env(safe-area-inset-top));inset-inline-end:16px;border:1.5px solid rgba(255,255,255,.7);background:rgba(255,255,255,.14);color:#fff;border-radius:99px;padding:8px 18px;font:700 15px Tahoma,Arial,sans-serif;cursor:pointer}
.cards{display:flex;flex-direction:column;gap:12px;width:100%;max-width:360px}
.cards button{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border:0;border-radius:18px;background:#fff;color:#0b3d3a;font:inherit;text-align:start;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.22)}
.cards button:active{transform:scale(.98)}
.cards .em{font-size:34px;line-height:1}.cards b{display:block;font-size:19px}.cards small{display:block;color:#4b6663;font-size:13px;margin-top:2px}
#pick .nt{font-size:12.5px;opacity:.8;margin-top:6px}
#sw{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:8;width:38px;height:38px;border:0;border-radius:50%;background:rgba(15,118,110,.88);color:#fff;font-size:18px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.3);padding:0}
#ib{position:fixed;left:12px;right:12px;bottom:calc(60px + env(safe-area-inset-bottom));z-index:9;display:none;align-items:center;gap:10px;background:#0f766e;color:#fff;border-radius:14px;padding:10px 14px;font:700 14px Tahoma,Arial,sans-serif;box-shadow:0 4px 18px rgba(0,0,0,.3)}
#ib span{flex:1}#ib button{border:0;border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
#ib .go{background:#fff;color:#0f766e}#ib .no{background:transparent;color:#fff;padding:8px}
</style></head><body>
<iframe id="f" class="hide" title="Wasel" allow="geolocation; camera; microphone; clipboard-write; fullscreen"></iframe>

<div id="pick" class="hide">
<button id="lg">English</button>
<img class="logo" src="icon.svg" alt="Wasel">
<h1>واصل<small>WASEL</small></h1><p id="tg"></p>
<div class="cards">
<button id="bu"><span class="em">🛍️</span><span><b id="t1"></b><small id="s1"></small></span></button>
<button id="bc"><span class="em">🏍️</span><span><b id="t2"></b><small id="s2"></small></span></button>
</div>
<div class="nt" id="nt"></div>
</div>

<button id="sw" class="hide" aria-label="Switch">⇄</button>
<div id="ib"><span id="it"></span><button class="go" id="ig"></button><button class="no" id="ix">✕</button></div>

<script>
/* ===== غيّر هذا الرابط فقط لو غيّرت رابط التطبيق ===== */
var APP = "https://script.google.com/macros/s/AKfycbwmS0DX-pqH17-cKKftKNqjVzD3lMuskpL8MvFKJpfSGt3uyVk5bli1dWeGOq782YbnLg/exec";
/* ======================================================== */
function $(i){return document.getElementById(i)}
var RK = "wasel_role", LK = "wasel_lang";   // الدور: u عميل ، c مندوب  |  اللغة: ar أو en
function lsGet(k){try{return localStorage.getItem(k)||""}catch(e){return ""}}
function lsSet(k,v){try{if(v)localStorage.setItem(k,v);else localStorage.removeItem(k)}catch(e){}}
function getRole(){var r=lsGet(RK);return r==="u"||r==="c"?r:""}
var WL = lsGet(LK) === "en" ? "en" : "ar";

var TX = {
  ar:{lg:"English",tg:"واصل، خليك واصل",t1:"اطلب توصيل",s1:"اطلب من أي مطعم أو متجر في عنيزة",t2:"أنا مندوب",s2:"الدخول برمز المندوب الخاص بك",nt:"سنتذكر اختيارك في المرة القادمة، ويمكنك تغييره من الزر ⇄",inst:"ثبّت تطبيق واصل على شاشتك الرئيسية",ib:"تثبيت",ios:"لتثبيت التطبيق: اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية»",sw:"تغيير: عميل / مندوب"},
  en:{lg:"عربي",tg:"Wasel, always on the way",t1:"Order delivery",s1:"From any restaurant or store in Unayzah",t2:"I'm a courier",s2:"Sign in with your courier code",nt:"We'll remember your choice. You can change it with the ⇄ button",inst:"Install the Wasel app on your home screen",ib:"Install",ios:"To install: tap Share, then \"Add to Home Screen\"",sw:"Switch: customer / courier"}
};
function applyWL(){
  var t = TX[WL];
  document.documentElement.lang = WL; document.documentElement.dir = WL === "en" ? "ltr" : "rtl";
  $("lg").textContent = t.lg; $("tg").textContent = t.tg;
  $("t1").textContent = t.t1; $("s1").textContent = t.s1; $("t2").textContent = t.t2; $("s2").textContent = t.s2; $("nt").textContent = t.nt;
  $("sw").title = t.sw; $("ig").textContent = t.ib;
}
$("lg").onclick = function(){ WL = WL === "en" ? "ar" : "en"; lsSet(LK, WL); applyWL(); };
applyWL();

function params(){ try{return new URLSearchParams(location.search)}catch(e){return null} }
function without(p,k){var q=new URLSearchParams(p.toString());q.delete(k);var s=q.toString();return s?"?"+s:""}
function buildUrl(role, extra, lang){
  var qs = [];
  if (role === "c") qs.push("page=courier");
  if (extra) qs.push(String(extra).replace(/^[?&]/, ""));
  if (lang) qs.push("lang=" + lang);
  return APP + (qs.length ? "?" + qs.join("&") : "");
}
function openApp(role, extra, lang){
  $("pick").classList.add("hide");
  $("f").src = buildUrl(role, extra, lang); $("f").classList.remove("hide");
  $("sw").classList.remove("hide");
  var c = role === "c" ? "#0b3d3a" : "#0f766e";
  $("tc").setAttribute("content", c); document.body.style.background = c;
  document.title = role === "c" ? "واصل | Wasel - Courier" : "واصل | Wasel";
}
function showPick(){
  $("f").classList.add("hide"); $("f").src = "about:blank";
  $("sw").classList.add("hide"); $("ib").style.display = "none";
  $("pick").classList.remove("hide");
  $("tc").setAttribute("content", "#0f766e"); document.body.style.background = "#0f766e"; document.title = "واصل | Wasel";
}
// عند اختيار الدور من الشاشة الأولى نمرّر اللغة المختارة للصفحة (مرة واحدة)
$("bu").onclick = function(){ lsSet(RK, "u"); openApp("u", "", WL); };
$("bc").onclick = function(){ lsSet(RK, "c"); openApp("c", "", WL); };
$("sw").onclick = function(){ lsSet(RK, ""); showPick(); };

/* ===== تحديد ما يُفتح عند التشغيل ===== */
(function(){
  var p = params(), page = p && p.get("page"), r = p && p.get("r");
  if (page === "admin") { location.replace(APP + location.search); return; }
  if (r === "c" || r === "u") {                     // رابط مباشر لاختيار الدور (?r=c أو ?r=u)
    lsSet(RK, r); openApp(r, p ? without(p, "r").replace(/^\?/, "") : "", ""); return;
  }
  if (page === "courier") {                           // رابط صفحة المندوب القديم
    lsSet(RK, "c"); openApp("c", p ? without(p, "page").replace(/^\?/, "") : "", ""); return;
  }
  if (page) {                                         // تتبّع الطلب، التسجيل... تُفتح كما هي
    $("f").src = APP + location.search; $("f").classList.remove("hide"); $("sw").classList.remove("hide"); return;
  }
  var saved = getRole();
  if (saved) openApp(saved, "", ""); else showPick();
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}

/* أيقونة آيفون (PNG) تُولَّد من الشعار */
try {
  var im = new Image();
  im.onload = function () {
    try {
      var c = document.createElement("canvas"); c.width = c.height = 180;
      c.getContext("2d").drawImage(im, 0, 0, 180, 180);
      $("ati").href = c.toDataURL("image/png");
    } catch (e) {}
  };
  im.src = "icon.svg";
} catch (e) {}

/* زر التثبيت */
var dp = null, KEY = "pwa_hide";
function hidden() { return lsGet(KEY) === "1"; }
function standalone() { return (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true; }
function showBar(t, withBtn) {
  if (standalone() || hidden()) return;
  $("it").textContent = t; $("ig").style.display = withBtn ? "" : "none"; $("ib").style.display = "flex";
}
$("ix").onclick = function () { $("ib").style.display = "none"; lsSet(KEY, "1"); };
window.addEventListener("beforeinstallprompt", function (e) {
  e.preventDefault(); dp = e; showBar(TX[WL].inst, true);
});
$("ig").onclick = function () {
  if (!dp) return; dp.prompt();
  dp.userChoice.then(function () { dp = null; $("ib").style.display = "none"; });
};
window.addEventListener("appinstalled", function () { $("ib").style.display = "none"; });
if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !standalone()) {
  setTimeout(function () { showBar(TX[WL].ios, false); }, 2500);
}
</script></body></html>
