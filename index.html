<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>واصل</title>
<meta name="theme-color" content="#0f766e" id="tc">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" id="ati" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="واصل">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
html,body{margin:0;height:100%;background:#0f766e;overflow:hidden;font-family:Tahoma,Arial,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
.hide{display:none!important}
#pick{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;box-sizing:border-box;background:linear-gradient(160deg,#0b5e57,#0f766e 55%,#14a79a);color:#fff;text-align:center;overflow:auto}
#pick svg{width:84px;height:84px}
#pick h1{margin:0;font-size:32px}#pick p{margin:0 0 8px;opacity:.9;font-size:15px}
.cards{display:flex;flex-direction:column;gap:12px;width:100%;max-width:360px}
.cards button{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border:0;border-radius:18px;background:#fff;color:#0b3d3a;font:inherit;text-align:start;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.22)}
.cards button:active{transform:scale(.98)}
.cards .em{font-size:34px;line-height:1}.cards b{display:block;font-size:19px}.cards small{display:block;color:#4b6663;font-size:13px;margin-top:2px}
#pick .nt{font-size:12.5px;opacity:.8;margin-top:6px}
#sw{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:8;width:38px;height:38px;border:0;border-radius:50%;background:rgba(15,118,110,.88);color:#fff;font-size:18px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.3);padding:0}
#ib{position:fixed;left:12px;right:12px;bottom:calc(60px + env(safe-area-inset-bottom));z-index:9;display:none;align-items:center;gap:10px;background:#0f766e;color:#fff;border-radius:14px;padding:10px 14px;font:700 14px Tahoma,Arial,sans-serif;box-shadow:0 4px 18px rgba(0,0,0,.3)}
#ib span{flex:1}#ib button{border:0;border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
#ib .go{background:#fff;color:#0f766e}#ib .no{background:transparent;color:#fff;padding:8px}
</style></head><body>
<iframe id="f" class="hide" title="واصل" allow="geolocation; camera; microphone; clipboard-write; fullscreen"></iframe>

<div id="pick" class="hide">
<svg viewBox="0 0 64 64"><rect width="64" height="64" rx="18" fill="#fff"/><path d="M32 9c-9 0-16.2 7-16.2 15.7C15.8 37.4 32 53 32 53s16.2-15.6 16.2-28.3C48.2 16 41 9 32 9z" fill="#0f766e"/><circle cx="32" cy="24.5" r="7.5" fill="#fff"/><path d="M28.5 24.5h7m-3-3.5 3.5 3.5-3.5 3.5" fill="none" stroke="#0f766e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
<h1>واصل</h1><p>أهلًا بك، واصل، خليك واصل</p>
<div class="cards">
<button id="bu"><span class="em">🛍️</span><span><b>اطلب توصيل</b><small>اطلب من أي مطعم أو متجر في عنيزة</small></span></button>
<button id="bc"><span class="em">🏍️</span><span><b>أنا مندوب</b><small>الدخول برمز المندوب الخاص بك</small></span></button>
</div>
<div class="nt">سنتذكر اختيارك في المرة القادمة، ويمكنك تغييره من الزر ⇄</div>
</div>

<button id="sw" class="hide" title="تغيير: عميل / مندوب" aria-label="تغيير">⇄</button>
<div id="ib"><span id="it"></span><button class="go" id="ig">تثبيت</button><button class="no" id="ix">✕</button></div>

<script>
/* ===== غيّر هذا الرابط فقط لو غيّرت رابط التطبيق ===== */
var APP = "https://script.google.com/macros/s/AKfycbwmS0DX-pqH17-cKKftKNqjVzD3lMuskpL8MvFKJpfSGt3uyVk5bli1dWeGOq782YbnLg/exec";
/* ======================================================== */
function $(i){return document.getElementById(i)}
var RK = "wasel_role";   // u = عميل ، c = مندوب
function getRole(){try{var r=localStorage.getItem(RK);return r==="u"||r==="c"?r:""}catch(e){return ""}}
function setRole(r){try{if(r)localStorage.setItem(RK,r);else localStorage.removeItem(RK)}catch(e){}}

function params(){
  try{return new URLSearchParams(location.search)}catch(e){return null}
}
function without(p,k){var q=new URLSearchParams(p.toString());q.delete(k);var s=q.toString();return s?"?"+s:""}

function openApp(role, extra){
  $("pick").classList.add("hide");
  var url = APP + (role === "c" ? "?page=courier" : "") + (extra || "");
  if (role === "c" && extra) url = APP + "?page=courier&" + extra.replace(/^[?&]/, "");
  else if (role !== "c" && extra) url = APP + extra;
  $("f").src = url; $("f").classList.remove("hide");
  $("sw").classList.remove("hide");
  var c = role === "c" ? "#0b3d3a" : "#0f766e";
  $("tc").setAttribute("content", c); document.body.style.background = c;
  document.title = role === "c" ? "واصل - المندوب" : "واصل";
}
function showPick(){
  $("f").classList.add("hide"); $("f").src = "about:blank";
  $("sw").classList.add("hide"); $("ib").style.display = "none";
  $("pick").classList.remove("hide");
  $("tc").setAttribute("content", "#0f766e"); document.body.style.background = "#0f766e"; document.title = "واصل";
}
$("bu").onclick = function(){ setRole("u"); openApp("u"); };
$("bc").onclick = function(){ setRole("c"); openApp("c"); };
$("sw").onclick = function(){ setRole(""); showPick(); };

/* ===== تحديد ما يُفتح عند التشغيل ===== */
(function(){
  var p = params(), page = p && p.get("page"), r = p && p.get("r");
  if (page === "admin") { location.replace(APP + location.search); return; }
  if (r === "c" || r === "u") {                     // رابط مباشر لاختيار الدور (?r=c أو ?r=u)
    setRole(r); openApp(r, p ? without(p, "r") : ""); return;
  }
  if (page === "courier") {                           // رابط صفحة المندوب القديم
    setRole("c"); openApp("c", p ? without(p, "page") : ""); return;
  }
  if (page) {                                         // تتبّع الطلب، التسجيل... تُفتح كما هي
    $("f").src = APP + location.search; $("f").classList.remove("hide"); $("sw").classList.remove("hide"); return;
  }
  var saved = getRole();
  if (saved) openApp(saved); else showPick();
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}

/* أيقونة آيفون (PNG) تُولَّد من الشعار */
try {
  var im = new Image();
  im.onload = function () {
    try {
      var c = document.createElement("canvas"); c.width = c.height = 180;
      c.getContext("2d").drawImage(im, 0, 0, 180, 180);
      $("ati").href = c.toDataURL("image/png");
    } catch (e) {}
  };
  im.src = "icon.svg";
} catch (e) {}

/* زر التثبيت */
var dp = null, KEY = "pwa_hide";
function hidden() { try { return localStorage.getItem(KEY) === "1"; } catch (e) { return false; } }
function standalone() { return (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true; }
function showBar(t, withBtn) {
  if (standalone() || hidden()) return;
  $("it").textContent = t; $("ig").style.display = withBtn ? "" : "none"; $("ib").style.display = "flex";
}
$("ix").onclick = function () { $("ib").style.display = "none"; try { localStorage.setItem(KEY, "1"); } catch (e) {} };
window.addEventListener("beforeinstallprompt", function (e) {
  e.preventDefault(); dp = e; showBar("ثبّت تطبيق واصل على شاشتك الرئيسية", true);
});
$("ig").onclick = function () {
  if (!dp) return; dp.prompt();
  dp.userChoice.then(function () { dp = null; $("ib").style.display = "none"; });
};
window.addEventListener("appinstalled", function () { $("ib").style.display = "none"; });
if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !standalone()) {
  setTimeout(function () { showBar("لتثبيت التطبيق: اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية»", false); }, 2500);
}
</script></body></html>
