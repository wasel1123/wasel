   وعنيزة زي ما هي. الإعدادات العامة (المدينة واللغة والوضع الداكن والمود والصوت) مشتركة */
if(ME!=="unz"){try{var SP=Storage.prototype,PF=ME==="mhl"?"mh_":ME+"_",SH={wcity:1,wcity_nb:1,wl:1,wth:1,wgd:1,wss:1,ws:1,wloc:1};
  var gi=SP.getItem,si=SP.setItem,ri=SP.removeItem;
  function key(st,k){return (st===window.localStorage&&!SH[k])?PF+k:k}

function go(v){sv(v);if(v!==ME)location.replace(C[v].p+page+location.search);else{var o=document.getElementById("wcity");if(o)o.remove()}}
function km(a,b,c2,d){var r=Math.PI/180,x=(c2-a)*r,y=(d-b)*r,h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c2*r)*Math.sin(y/2)*Math.sin(y/2);return 12742*Math.asin(Math.sqrt(h))}

  var box=el("div","width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px;align-items:stretch;margin:auto 0");o.appendChild(box);
  function perm(){box.textContent="";
    box.appendChild(el("div","font-size:60px","📍"));
    box.appendChild(el("b","font-size:22px","علشان نوصّلك أسرع"));
    box.appendChild(el("div","color:#d5ebe8;font-size:15px","واصل محتاج موقعك علشان يفتحلك مدينتك على طول، ويحسب رسوم التوصيل صح."));
    var a=el("button","border:0;border-radius:16px;padding:14px;background:#f2b544;color:#1b1200;font:inherit;font-weight:800;font-size:17px;margin-top:6px","سماح بالموقع");a.type="button";

    CO.forEach(function(cc){box.appendChild(el("div","text-align:right;font-weight:800;font-size:14px;color:#d5ebe8;margin-top:6px",cc[0]));
      var k=cc[1],x=C[k],bt=el("button","display:flex;align-items:center;gap:12px;border:0;border-radius:18px;padding:12px 14px;background:#fff;color:#0e4f4c;font:inherit;text-align:right;cursor:pointer");bt.type="button";

      bt.appendChild(el("span","background:#22c55e;color:#052e16;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:800","متاح ✓"));
      bt.onclick=function(){go(k)};box.appendChild(bt);

      cc[2].forEach(function(n){var d=el("div","flex:1;border-radius:14px;padding:9px 10px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.6);font-size:14px;display:flex;justify-content:space-between;align-items:center;cursor:not-allowed");
        d.appendChild(el("b",null,n));d.appendChild(el("small","font-size:11px;background:rgba(255,255,255,.2);border-radius:99px;padding:1px 8px","قريبًا"));d.setAttribute("aria-disabled","true");rw.appendChild(d)});

    if(!first){var x=el("button","border:0;background:none;color:#d5ebe8;font:inherit;text-decoration:underline","رجوع");x.type="button";x.onclick=function(){o.remove()};box.appendChild(x)}}
  if(first)perm();else pick("اختار المدينة");
  document.body.appendChild(o)}
window.WCITY={open:function(){show(false)}};
/* تصحيح المدينة: أول ما العميل يحدد موقعه (أو موقع المندوب يشتغل) ويطلع في المدينة التانية، يظهرله شريط يتنقل بيه */
var WARNED=false;
function banner(k){if(WARNED||!document.body)return;try{if(sessionStorage.getItem("wcity_nb")===k)return}catch(e){}WARNED=true;
  var o=el("div","position:fixed;top:8px;left:8px;right:8px;z-index:2147482000;background:#f2b544;color:#1b1200;border-radius:16px;padding:12px 14px;box-shadow:0 6px 20px rgba(0,0,0,.3);direction:rtl;font-family:inherit;display:flex;flex-direction:column;gap:8px");o.id="wcity_nb";

  for(var k in C)if(k!==ME&&km(la,ln,C[k].la,C[k].ln)<=C[k].km){banner(k);return}}catch(e){}}
try{var G=navigator.geolocation;if(G){var gc=G.getCurrentPosition.bind(G),wp=G.watchPosition.bind(G);

  G.watchPosition=function(s,e,o){return wp(function(p){chk(p);if(s)s(p)},e,o)}}}catch(e){}

<script>/* زر «غيّر مودك / غيّري مودك»: يبدّل شكل التطبيق بين الأخضر والبينك، ويتحفظ على الجهاز بس (مش بيتبعت للسيرفر)، ومعاه «تراجع» */

function en(){return d.lang==="en"}

<script>

/* تطبيق واصل على أندرويد: الموقع يتبعت من التطبيق نفسه حتى والشاشة مقفولة أو وانت على خرايط جوجل */
(function(){var last="";

<script>
/* ===== فاتورة الطلب المبدئية: بتحوّل «مكونات الطلب» المكتوبة لسطور واضحة (العدد + الصنف + السعر لو معروف) ===== */
function rcptNum(s){return String(s==null?"":s).replace(/[٠-٩]/g,function(d){return "٠١٢٣٤٥٦٧٨٩".indexOf(d)}).replace(/[۰-۹]/g,function(d){return "۰۱۲۳۴۵۶۷۸۹".indexOf(d)})}
function rcptItem(p){p=String(p||"").replace(/^[\s\-•*·–—]+/,"").trim();if(!p)return null;var q=1,n=p,m;
  var w={"واحد":1,"وحدة":1,"اتنين":2,"اثنين":2,"ثنين":2,"تلاتة":3,"ثلاثة":3,"ثلاث":3,"أربعة":4,"اربعة":4,"خمسة":5};
  if((m=/^(\d{1,2})\s*(?:×|x|X|\*|حبة|حبات|علب|علبة|قطع|قطعة|كيلو|ك)?\s+(.+)$/.exec(p))){q=+m[1];n=m[2]}
  else if((m=/^(.+?)\s*(?:×|x|X|\*)\s*(\d{1,2})$/.exec(p))){n=m[1];q=+m[2]}
  else if((m=/^(واحد|وحدة|اتنين|اثنين|ثنين|تلاتة|ثلاثة|ثلاث|أربعة|اربعة|خمسة)\s+(.+)$/.exec(p))){q=w[m[1]];n=m[2]}
  return {q:q>0&&q<100?q:1,name:n.trim()}}
function rcptParse(txt){var t=rcptNum(txt).trim(),out={store:"",lines:[],total:"",note:""};if(!t)return out;
  var raw=t.split(/\n/),rest=[],i,L;
  /* عروض: سطر يبدأ بـ 🔥 وبعده سطور 🔢 🏪 📝 💰 ⏳ */
  for(i=0;i<raw.length;i++){L=raw[i].trim();
    if(/^🔥/.test(L)){var o={q:1,name:L.replace(/^🔥\s*[^:：]*[:：]\s*/,"").trim()||L.replace(/^🔥\s*/,""),offer:true,sub:"",price:"",det:""};
      while(i+1<raw.length&&/^(🔢|🏪|📝|💰|⏳)/.test(raw[i+1].trim())){i++;var x=raw[i].trim(),v=x.replace(/^\S+\s*[^:：]*[:：]\s*/,"").trim();
        if(/^🔢/.test(x))o.q=parseInt(v,10)||1;else if(/^🏪/.test(x))o.sub=v;else if(/^📝/.test(x))o.det=v;else if(/^💰/.test(x)){var pm=/=\s*([\d.]+)/.exec(v);o.price=pm?pm[1]:((/([\d.]+)/.exec(v)||[])[1]||"")}else if(/^⏳/.test(x))o.end=v}
      out.lines.push(o)}else if(L)rest.push(L)}
  t=rest.join("\n");if(!t)return out;
  /* من المنيو: «المطعم: 2 × صنف ، 1 × صنف | الإجمالي التقديري: 45 ريال» */
  var mm=/^([^:\n|]{1,60})[:：]\s*([\s\S]+?)(?:\s*\|\s*([^|]*?([\d.]+)[^|]*))?$/.exec(t);
  if(mm&&/×/.test(mm[2])){out.store=mm[1].trim();if(mm[4])out.total=mm[4];
    mm[2].split(/\s*[،,]\s*/).forEach(function(p){var it=rcptItem(p);if(it)out.lines.push(it)});return out}
  /* كلام عادي: كل سطر أو كل جزء بين «،» أو «+» صنف */
  t.split(/\n|\s*[،,]\s*|\s+\+\s+|\s+و\s*(?=\d)/).forEach(function(p){var it=rcptItem(p);if(it&&it.name.length>0)out.lines.push(it)});
  return out}
function rcptEl(txt,o){o=o||{};var P=rcptParse(txt);if(!P.lines.length)return null;
  var en=o.en,cur=o.cur||"",c=document.createElement("div");c.className="rcpt";
  var h=document.createElement("div");h.className="rch";h.innerHTML="";var hb=document.createElement("b");hb.textContent=o.title||"🧾";h.appendChild(hb);
  if(P.store){var hs=document.createElement("span");hs.textContent=P.store;h.appendChild(hs)}c.appendChild(h);
  P.lines.forEach(function(l){var r=document.createElement("div");r.className="rcr"+(l.offer?" of":"");

  if(P.total){var f=document.createElement("div");f.className="rcf";var a=document.createElement("span");a.textContent=en?"Estimated total":"الإجمالي التقريبي";var b=document.createElement("b");b.textContent=P.total+cur;f.appendChild(a);f.appendChild(b);c.appendChild(f)}
  if(o.foot){var ft=document.createElement("div");ft.className="rcft";ft.textContent=o.foot;c.appendChild(ft)}
  return c}
/* إشعارات الموبايل: لو الصفحة جوه تطبيق واصل على أندرويد، بنسجّل الجهاز (مرة في اليوم) علشان توصله الإشعارات (ملف Push.gs) */
(function(){function tryReg(){try{var A=window.WaselApp;if(!A||!A.token)return;var tk=String(A.token()||"");if(tk.length<60)return;
  var role="k",id=(typeof CODE!=="undefined"?CODE:"");if(!id)return;
  var day=new Date().toISOString().slice(0,10),sig=role+"|"+id+"|"+tk.slice(-12)+"|"+day,old="";try{old=localStorage.getItem("wpr")||""}catch(e){}

</script>
