function t(k){var d=T[k];return d?d[LANG==="en"?1:0]:k}
function tm(m){return LANG==="en"&&m&&M[m]?M[m]:m}
function $(i){return document.getElementById(i)}
function el(tg,c,x){var e=document.createElement(tg);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
var NATS=["سعودي","مصري","يمني","سوداني","سوري","أردني","باكستاني","هندي","بنغلاديشي","فلبيني","إندونيسي","نيبالي","إثيوبي","إريتري","أخرى"];

var PH=[{id:"p1",data:null},{id:"p2",data:null},{id:"p3",data:null}],SAVED=null,timer=null,LASTR=null,busy=false;
function pickImg(file,cb){
  if(!file){cb(null);return}
  var fr=new FileReader();
  fr.onload=function(){var im=new Image();
    im.onload=function(){var k=Math.min(1,1600/Math.max(im.width,im.height));
      var cv=document.createElement("canvas");cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);
      cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);cb(cv.toDataURL("image/jpeg",0.72))};
    im.onerror=function(){cb(null)};im.src=fr.result};
  fr.onerror=function(){cb(null)};fr.readAsDataURL(file)}
PH.forEach(function(p){
  var box=$(p.id),b=box.querySelector("button"),inp=box.querySelector("input"),im=box.querySelector("img"),st=box.querySelector(".st");
  p.b=b;p.st=st;
  b.onclick=function(){inp.click()};
  inp.onchange=function(){st.className="st mu";st.textContent=t("prep");b.disabled=true;
    pickImg(inp.files&&inp.files[0],function(d){b.disabled=false;p.data=d;
      if(d){im.src=d;im.style.display="block";st.className="st okc";st.textContent=t("ready");b.textContent=t("retake")}
      else{im.style.display="none";st.className="st err";st.textContent=t("bad");b.textContent=t("pick")}})}});
var LG=null;
function legalUi(){
  var b=$("lg");b.textContent="";if(!LG)return;
  [["lgT",LG.termsCourier],["lgP",LG.privacyCourier]].forEach(function(x,i){
    if(typeof x[1]!=="string"||!/^https:\/\//.test(x[1]))return;
    if(i)b.appendChild(document.createTextNode(" · "));
    var a=document.createElement("a");a.textContent=t(x[0]);a.href=x[1];a.target="_blank";a.rel="noopener noreferrer";a.style.color="var(--br)";b.appendChild(a)})}
function applyLang(){
  document.documentElement.lang=LANG;document.documentElement.dir=LANG==="en"?"ltr":"rtl";
  document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=t(e.getAttribute("data-i"))});
  document.querySelectorAll("[data-ph]").forEach(function(e){e.placeholder=t(e.getAttribute("data-ph"))});
  PH.forEach(function(p){if(p.data)p.b.textContent=t("retake")});
  $("lang").textContent=LANG==="en"?"عربي":"EN";
  legalUi();
  if(LASTR)showRes(LASTR)}
$("lang").onclick=function(){LANG=LANG==="en"?"ar":"en";try{localStorage.setItem("wl",LANG)}catch(e){}try{window.top.postMessage({wasel_lang:LANG},"*")}catch(e){}applyLang()};
function tab(w){
  $("tR").classList.toggle("on",w==="r");$("tS").classList.toggle("on",w==="s");
  $("vForm").classList.toggle("hide",w!=="r");$("vStat").classList.toggle("hide",w!=="s")}
$("tR").onclick=function(){tab("r")};$("tS").onclick=function(){tab("s")};
$("send").onclick=function(){
  if(busy)return;
  var e=$("ferr");e.textContent="";
  var name=$("name").value.replace(/\s+/g," ").trim(),phone=$("phone").value.trim(),nat=$("nat").value.trim();
  if(name.length<5||name.indexOf(" ")<0){e.textContent=t("eName");return}
  if(!/^(?:\+?20|0)?1[0125]\d{8}$/.test(phone.replace(/[\s\-]/g,"").replace(/[٠-٩]/g,function(d){return String(d.charCodeAt(0)-0x0660)}))){e.textContent=t("ePhone");return}
  if(nat.length<2){e.textContent=t("eNat");return}
  if(!PH[0].data||!PH[1].data||!PH[2].data){e.textContent=t("ePh");return}
  if(!$("agree").checked){e.textContent=t("eAgree");return}
  busy=true;$("send").disabled=true;e.className="err mu";e.textContent=t("sending");
  google.script.run.withSuccessHandler(function(r){busy=false;$("send").disabled=false;e.className="err";
    if(r&&r.ok){e.textContent="";SAVED={no:r.no,p4:r.p4};try{localStorage.setItem("wr",JSON.stringify(SAVED))}catch(x){}
      $("sno").value=r.no;$("sp4").value=r.p4;tab("s");lookup(true)}
    else e.textContent=tm(r&&r.msg)||t("noConn")})
  .withFailureHandler(function(){busy=false;$("send").disabled=false;e.className="err";e.textContent=t("noConn")})
  .registerCourier({name:name,phone:phone,nat:nat,iq:PH[0].data,veh:PH[1].data,lic:PH[2].data,agree:true})};
function lookup(quiet){
  var no=$("sno").value.trim(),p4=$("sp4").value.trim();
  if(!no||p4.length!==4)return;
  $("sgo").disabled=true;$("serr").textContent="";
  google.script.run.withSuccessHandler(function(r){$("sgo").disabled=false;
    if(r&&r.ok){SAVED={no:r.no,p4:p4};try{localStorage.setItem("wr",JSON.stringify(SAVED))}catch(x){}LASTR=r;showRes(r);poll(r)}
    else if(!quiet)$("serr").textContent=tm(r&&r.msg)||t("noConn")})
  .withFailureHandler(function(){$("sgo").disabled=false;if(!quiet)$("serr").textContent=t("noConn")}).registerStatus(no,p4)}
function poll(r){
  clearInterval(timer);timer=null;
  if(r&&r.status==="جديد")timer=setInterval(function(){if(!document.hidden)lookup(true)},(r.tg&&r.tg.on&&!r.tg.linked)?7000:20000)}
function showRes(r){
  var c=$("res");c.textContent="";c.classList.remove("hide");
  c.appendChild(el("div","mu",t("rno")));
  c.appendChild(el("div","no",r.no));
  if(r.status==="جديد"){
    c.appendChild(el("span","pill w",t("sPend")));c.appendChild(el("p","mu",t("sPendD")));c.appendChild(el("div","mu",t("keep")));
    c.appendChild(el("p","mu",t("tgD")))}
  else if(r.status==="مقبول"){
    c.appendChild(el("div","big okc",t("sOk")));
    if(r.code){
      c.appendChild(el("div","mu",t("sCode")));c.appendChild(el("div","code",r.code));
      var b=el("button",null,t("copy"));b.onclick=function(){try{navigator.clipboard.writeText(r.code);b.textContent=t("copied")}catch(e){}};c.appendChild(b);
      if(r.url){var a=el("a","go",t("sOpen"));a.href=r.url;a.target="_blank";a.rel="noopener noreferrer";c.appendChild(a)}
      if(r.group){var gp=el("a","go",t("sGrp"));gp.href=r.group;gp.target="_blank";gp.rel="noopener noreferrer";c.appendChild(gp)}}
    else c.appendChild(el("p","err",r.courierName&&r.active===false?t("sOff"):t("sNoAcc")))}
  else{
    c.appendChild(el("div","big err",t("sNo")));
    if(r.note)c.appendChild(el("p",null,t("sWhy")+r.note));
    var n=el("button","sec",t("again"));n.onclick=function(){try{localStorage.removeItem("wr")}catch(e){}SAVED=null;LASTR=null;clearInterval(timer);c.classList.add("hide");$("sno").value="";$("sp4").value="";tab("r")};c.appendChild(n)}}
$("sgo").onclick=function(){lookup(false)};
applyLang();
try{google.script.run.withSuccessHandler(function(r){LG=r;legalUi()}).withFailureHandler(function(){}).legalLinks()}catch(e){}
try{var s=JSON.parse(localStorage.getItem("wr")||"null");if(s&&s.no){SAVED=s;$("sno").value=s.no;$("sp4").value=s.p4||"";tab("s");lookup(true)}}catch(e){}
/* لغة التطبيق من الغلاف (?lang=en أو ar) */
try{google.script.url.getLocation(function(l){var g=l&&l.parameter&&l.parameter.lang;if((g==="en"||g==="ar")&&g!==LANG){LANG=g;try{localStorage.setItem("wl",g)}catch(e){}applyLang()}})}catch(e){}
